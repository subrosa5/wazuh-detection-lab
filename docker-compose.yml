# Minimal single-service lab: just enough to load our custom rules,
# decoders and CDB lists into a real wazuh-manager and drive them with
# wazuh-logtest (interactively, or via tests/run_tests.py in CI).
#
# This intentionally does NOT stand up the full indexer/dashboard stack -
# for that, layer the official multi-container stack from
# https://github.com/wazuh/wazuh-docker (single-node/) on top; this repo
# only needs analysisd, which lives in the manager image alone.
#
# Version is pinned deliberately (never `latest`) so CI doesn't silently
# break when Wazuh ships a new release - see README.md "Versioning".
services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.7
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514/udp"  # agent event collection
      - "1515:1515"      # agent enrollment
      - "55000:55000"    # REST API (not used by the test harness, exposed for manual use)
    volumes:
      - ./rules:/var/ossec/etc/rules:ro
      - ./decoders:/var/ossec/etc/decoders:ro
      - ./lists:/var/ossec/etc/lists   # NOT read-only: Wazuh compiles each
        # plaintext list to a .cdb file in this same directory on load
    healthcheck:
      test: ["CMD", "/var/ossec/bin/wazuh-control", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
