name: detection-ci

on:
  pull_request:
    paths:
      - "rules/**"
      - "decoders/**"
      - "lists/**"
      - "tests/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]

# Default token grant is read-only: this workflow never needs to write
# to the repo (no auto-commits, no PR comments), so it doesn't get the
# permission to. Narrow the block further per-job if a future job needs
# something this one doesn't.
permissions:
  contents: read

# This is the quality gate the whole repo is built around: a rule/decoder
# change cannot merge unless it (a) is well-formed, (b) doesn't collide
# with another local rule ID, and (c) proves itself against a live
# wazuh-manager via wazuh-logtest - both on its attack sample and its
# paired benign sample. Notably, this goes a step further than Wazuh's
# own official Ruleset-as-Code pipeline, which validates rule ID
# uniqueness but (per their public writeup) does not run wazuh-logtest
# in CI: https://wazuh.com/blog/wazuh-ruleset-as-code-rac/
jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not the mutable v4 tag - a compromised or
      # re-tagged v4 can't silently run different code in this pipeline.
      # Re-pin deliberately when bumping: resolve the tag's current SHA
      # (e.g. `gh api repos/actions/checkout/commits/v4 --jq .sha`) and
      # update both the SHA and the version comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate rule/decoder XML is well-formed
        run: python3 scripts/validate_xml.py

      - name: Check for duplicate / out-of-range rule IDs
        run: python3 scripts/check_rule_ids.py

      - name: Start Wazuh manager (waits on the container health check)
        run: docker compose up -d --wait --wait-timeout 240

      - name: Register CDB lists and restart analysisd
        run: bash scripts/bootstrap_manager.sh wazuh-manager

      - name: Run detection regression tests
        run: python3 tests/run_tests.py --container wazuh-manager

      - name: Manager logs (on failure)
        if: failure()
        run: |
          docker inspect --format='{{json .State.Health}}' wazuh-manager | python3 -m json.tool || true
          docker logs wazuh-manager --tail 300
          echo "--- ossec.conf <list> registrations ---"
          docker exec wazuh-manager grep -n "<list>" /var/ossec/etc/ossec.conf || true
          echo "--- /var/ossec/etc/lists contents (compiled .cdb should sit next to each source file) ---"
          docker exec wazuh-manager ls -la /var/ossec/etc/lists/ || true
          echo "--- lsass-access-allowlist as seen inside the container (od -c to catch hidden/escaped bytes) ---"
          docker exec wazuh-manager sh -c "od -c /var/ossec/etc/lists/lsass-access-allowlist | head -40" || true

      - name: Regenerate MITRE coverage layer
        run: python3 scripts/generate_mitre_navigator_layer.py

      - name: Fail if generated MITRE coverage is out of date
        run: |
          git diff --exit-code -- docs/mitre-coverage.md docs/mitre-coverage.json \
            || { echo "::error::docs/mitre-coverage.* is stale - run scripts/generate_mitre_navigator_layer.py and commit the result"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mitre-coverage-layer
          path: docs/mitre-coverage.json
